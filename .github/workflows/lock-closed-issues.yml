name: Lock closed issues

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "closed",
              per_page: 100,
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;
              if (issue.locked) continue;
              if (new Date(issue.closed_at) > sevenDaysAgo) continue;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "This issue has been automatically locked since it has been closed for 7 days. If you're experiencing a similar problem, please [open a new issue](https://github.com/brainushq/brainus-ai-api/issues/new/choose).",
              });

              await github.rest.issues.lock({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                lock_reason: "resolved",
              });
            }
